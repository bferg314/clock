name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A PR that is pushed to repeatedly only needs its newest commit checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The whole job is a few seconds of work; anything longer is wedged.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches .nvmrc and the Dockerfile builder stage.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
